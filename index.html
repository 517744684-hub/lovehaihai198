<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>幸福海导航</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="styles.css?v=20260809-4">
</head>
<body>
<header class="hero" id="hero">
  <div class="hero-glow"></div>
  <div class="clock-lockup"><div class="clock" id="clock">00:00:00</div><div class="date" id="date">2026年08月07日 星期五</div></div>
  <div class="search-tabs" id="searchTabs"><button class="active" data-engine="https://www.baidu.com/s?wd=">百度</button><button data-engine="https://www.bing.com/search?q=">必应</button><button data-engine="https://www.google.com/search?q=">谷歌</button></div>
  <form class="search-bar" id="searchForm"><input id="searchInput" placeholder="百度一下" autocomplete="off"><button type="submit" aria-label="搜索"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.8" cy="10.8" r="6.6"></circle><path d="m16 16 5 5"></path></svg></button></form>
  <div class="recent-wrap"><div class="section-kicker">最近访问</div><div class="recent-list" id="recentList"></div></div>
</header>
<main class="content"><section class="featured-panel"><div class="vertical-groups" id="verticalGroups"></div><aside class="hot-panel"><div class="panel-title"><i class="fa-solid fa-ranking-star"></i> 百度热点</div><div id="hotList"><div class="hot-loading">正在获取实时热点...</div></div><div class="hot-footer"><button id="hotPrev" title="上一页"><svg viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></svg></button><button id="hotNext" title="下一页"><svg viewBox="0 0 24 24"><path d="m10 5 7 7-7 7"/></svg></button><button id="hotRefresh" title="刷新热点"><svg viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0 1 4M20 5v6h-6"/></svg></button></div></aside></section><section id="footerGroups" class="footer-groups"></section></main>
<nav class="floating-tools" aria-label="工具栏">
  <button data-action="add" title="新增网址"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><button data-action="import" title="导入本地浏览器收藏夹"><svg viewBox="0 0 24 24"><path d="M4 6h6l2 2h8v11H4zM12 12v5M9.5 14.5 12 17l2.5-2.5"/></svg></button><button data-action="export" title="导出当前备份"><svg viewBox="0 0 24 24"><path d="M12 3v12M8 11l4 4 4-4M5 20h14"/></svg></button><button data-action="restore" title="还原本地备份"><svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 3-6M4 5v7h7"/></svg></button><button data-action="edit" title="编辑模式"><svg viewBox="0 0 24 24"><path d="m4 20 4-.8L19 8l-3-3L5 16zM13 6l3 3"/></svg></button><button data-action="theme" title="背景设置"><svg viewBox="0 0 24 24"><path d="M12 3a9 9 0 1 0 9 9h-4a2 2 0 0 1-2-2V8a5 5 0 0 0-5-5zM7 12h.01M8 7h.01M12 6h.01"/></svg></button><button data-action="clear" title="清空所有网址"><svg viewBox="0 0 24 24"><path d="M5 7h14M10 11v6M14 11v6M9 7l1-3h4l1 3m-9 0 1 14h10l1-14"/></svg></button>
</nav>
<input type="file" id="fileInput" accept=".json,.html,.htm" hidden>
<dialog id="backgroundDialog"><div class="background-modal"><button class="modal-close" id="closeBackground" aria-label="关闭">×</button><h2>背景设置</h2><button class="background-option selected" data-background="color"><span class="option-icon color-icon"><i class="fa-solid fa-palette"></i></span><span><b>纯色背景</b><small>使用当前深色/浅色主题颜色</small></span></button><button class="background-option" data-background="bing"><span class="option-icon bing-icon"><i class="fa-solid fa-globe"></i></span><span><b>随机必应壁纸</b><small>一键获取每日精选高清壁纸</small></span></button><button class="background-option" data-background="upload"><span class="option-icon upload-icon"><i class="fa-regular fa-image"></i></span><span><b>上传本地图片</b><small>支持 JPG、PNG、WebP 格式</small></span></button><button class="background-dismiss" id="closeBackgroundBottom">关闭</button><input type="file" id="backgroundInput" accept="image/jpeg,image/png,image/webp" hidden></div></dialog>
<dialog id="editDialog"><form method="dialog" id="editForm"><h2 id="editDialogTitle">新增网址</h2><label>名称<input id="siteName" placeholder="例如：抖音" required></label><label>网址<input id="siteUrl" type="url" placeholder="https://douyin.com" required></label><label>分组<select id="siteGroup"></select></label><input id="newGroupName" class="new-group-input" placeholder="输入新分类名称"><label>自定义图标 <span class="label-hint">可选，获取不到网址图标时使用</span><input id="siteIconFile" type="file" accept="image/png,image/jpeg,image/webp,image/x-icon,.ico"></label><div class="dialog-actions"><button type="button" id="cancelEdit">取消</button><button class="primary" value="default">确认添加</button></div></form></dialog>
<dialog id="groupDialog"><form method="dialog" id="groupForm"><h2>编辑分组</h2><label>分组名称<input id="groupName" required></label><label>分组图标<input id="groupIconFile" type="file" accept="image/png,image/jpeg,image/webp,image/x-icon,.ico"></label><div class="dialog-actions"><button type="button" id="cancelGroupEdit">取消</button><button class="primary" value="default">确认保存</button></div></form></dialog>
<script src="app.js?v=20260809-17"></script>
</body></html>
